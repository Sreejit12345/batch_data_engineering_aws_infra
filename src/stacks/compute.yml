# Note before deploying this- we must make sure storage and networking stack for that env has been deployed

# make sure to give the dependencies from requirments.txt of the code module in comma separated manner. If dependencies changes the parameter default must be updated.

#aiobotocore==2.26.0,aiohappyeyeballs==2.6.1,aiohttp==3.13.5,aioitertools==0.13.0,aiosignal==1.4.0,annotated-types==0.7.0,async-timeout==5.0.1,attrs==26.1.0,boto3==1.41.5,botocore==1.41.5,cachetools==5.5.2,certifi==2026.10.23,charset-normalizer==3.5.2,click==8.1.8,dotenv==0.9.9,frozenlist==1.8.0,fsspec==2025.10.0,idna==3.20,jmespath==1.1.0,markdown-it-py==3.0.0,mdurl==0.1.2,mmh3==5.2.0,multidict==6.7.1,mypy-boto3-glue==1.43.118,numpy==2.0.2,packaging==26.3,pandas==2.3.3,propcache==0.4.1,pyarrow==19.0.1,pydantic==2.13.5,pydantic_core==2.46.5,Pygments==2.21.0,pyiceberg==0.9.1,pyparsing==3.3.3,python-dateutil==2.9.0.post0,python-dotenv==1.2.1,pytz==2026.5,requests==2.32.5,rich==13.9.4,s3fs==2025.10.0,s3transfer==0.15.0,six==1.17.0,sortedcontainers==2.4.0,strictyaml==1.7.3,tenacity==9.1.2,typing-inspection==0.4.2,typing_extensions==4.16.0,tzdata==2026.5,urllib3==1.26.20,wrapt==1.17.3,yarl==1.22.0
# The above dependencies are installed at runtime by python shell.


# Based on env this creates:
# 1 ingestion glue python shell job
# 1 bronze pyspark glue job
# 1 silver pyspark glue job
# 1 step function state machine
# 1 event bridge scheduler
# 1 sns subscription for success or failure emails - remember we need to confirm subscription in email to receive emails

Parameters:
  env:
    Type: String
    AllowedValues: [dev, prod]
  
  dependencies:
    Type: String
    Default: aiobotocore==2.26.0,aiohappyeyeballs==2.6.1,aiohttp==3.13.5,aioitertools==0.13.0,aiosignal==1.4.0,annotated-types==0.7.0,async-timeout==5.0.1,attrs==26.1.0,boto3==1.41.5,botocore==1.41.5,cachetools==5.5.2,certifi==2026.10.23,charset-normalizer==3.5.2,click==8.1.8,dotenv==0.9.9,frozenlist==1.8.0,fsspec==2025.10.0,idna==3.20,jmespath==1.1.0,markdown-it-py==3.0.0,mdurl==0.1.2,mmh3==5.2.0,multidict==6.7.1,mypy-boto3-glue==1.43.118,numpy==2.0.2,packaging==26.3,pandas==2.3.3,propcache==0.4.1,pyarrow==19.0.1,pydantic==2.13.5,pydantic_core==2.46.5,Pygments==2.21.0,pyiceberg==0.9.1,pyparsing==3.3.3,python-dateutil==2.9.0.post0,python-dotenv==1.2.1,pytz==2026.5,requests==2.32.5,rich==13.9.4,s3fs==2025.10.0,s3transfer==0.15.0,six==1.17.0,sortedcontainers==2.4.0,strictyaml==1.7.3,tenacity==9.1.2,typing-inspection==0.4.2,typing_extensions==4.16.0,tzdata==2026.5,urllib3==1.26.20,wrapt==1.17.3,yarl==1.22.0

Resources:  
  MyIngestionJobGlue:
    Type: AWS::Glue::Job
    Properties:
      Role: 
         Fn::ImportValue: !Sub "glueIam-${env}"
      Command:
        Name: pythonshell
        ScriptLocation: !Sub "s3://sourcecode-githubanalytics-${env}/src/extract/ingestion.py"
        PythonVersion: 3.9
      Name: !Sub githubanalytics-extract-${env}
      JobMode : SCRIPT
      DefaultArguments:
        "--enable-glue-datacatalog": "true"
        "--job-language": "python"
        "--env": !Sub "${env}"
        "--additional-python-modules": !Ref dependencies
        "--extra-py-files": !Sub "s3://sourcecode-githubanalytics-${env}/src/githubanalytics-1.0.0-py3-none-any.whl"


  MyBronzeJobGlue:
    Type: AWS::Glue::Job
    Properties:
      Role: 
         Fn::ImportValue: !Sub "glueIam-${env}"
      GlueVersion: 6.0
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub "s3://sourcecode-githubanalytics-${env}/src/extract/changelog.py"
      Name: !Sub githubanalytics-bronzeingestion-${env}
      JobMode : SCRIPT
      WorkerType : G.1X
      NumberOfWorkers: 2
      DefaultArguments:
        "--datalake-formats": "iceberg"
        "--enable-glue-datacatalog": "true"
        "--job-language": "python"
        "--env": !Sub "${env}"
        "--conf": "spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO --conf spark.eventLog.rolling.enabled=true --conf spark.sql.catalog.glue_catalog.glue.skip-name-validation=true --conf spark.sql.defaultCatalog=glue_catalog --conf spark.sql.catalog.glue_catalog.warehouse=s3://idfk/"
        "--extra-py-files": !Sub "s3://sourcecode-githubanalytics-${env}/src/githubanalytics-1.0.0-py3-none-any.whl"
        "--additional-python-modules": "dotenv"


  MySilverJobGlue:
    Type: AWS::Glue::Job
    Properties:
      Role: 
         Fn::ImportValue: !Sub "glueIam-${env}"
      GlueVersion: 6.0
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub "s3://sourcecode-githubanalytics-${env}/src/transform/silver_transform.py"
      Name: !Sub githubanalytics-silvertransform-${env}
      JobMode : SCRIPT
      WorkerType : G.1X
      NumberOfWorkers: 2
      DefaultArguments:
        "--datalake-formats": "iceberg"
        "--enable-glue-datacatalog": "true"
        "--job-language": "python"
        "--env": !Sub "${env}"
        "--conf": "spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO --conf spark.eventLog.rolling.enabled=true --conf spark.sql.catalog.glue_catalog.glue.skip-name-validation=true --conf spark.sql.defaultCatalog=glue_catalog --conf spark.sql.catalog.glue_catalog.warehouse=s3://idfk/ --conf spark.sql.optimizer.runtime.rowLevelOperationGroupFilter.enabled=false"
        "--extra-py-files": !Sub "s3://sourcecode-githubanalytics-${env}/src/githubanalytics-1.0.0-py3-none-any.whl"
        "--additional-python-modules": "dotenv"

  
  MyStepFunction2:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "orchestrator-workflow-${env}"
      RoleArn: 
        Fn::ImportValue: !Sub "stepfnIAM-${env}"
      DefinitionString: |
        {
          "Comment": "My State machine",
          "StartAt": "Extract Job",
          "States": {
            "Extract Job": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {
                "JobName.$": "States.Format('githubanalytics-extract-{}', $.environment)"
              },
              "Next": "Bronze Changelog",
              "ResultPath": null,
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "SNS Publish Failure",
                  "Comment": "Default catch",
                  "ResultPath": null
                }
              ]
            },
            "Bronze Changelog": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {
                "JobName.$": "States.Format('githubanalytics-bronzeingestion-{}', $.environment)"
              },
              "Next": "Silver Job Run",
              "ResultPath": null,
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Comment": "default",
                  "Next": "SNS Publish Failure",
                  "ResultPath": null
                }
              ]
            },
            "Silver Job Run": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {
                "JobName.$": "States.Format('githubanalytics-silvertransform-{}', $.environment)"
              },
              "ResultPath": null,
              "Next": "SNS Publish Success",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Comment": "default",
                  "Next": "SNS Publish Failure",
                  "ResultPath": null
                }
              ]
            },
            "SNS Publish Success": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn.$": "States.Format('arn:aws:sns:ap-south-1:468094684048:github-analytics-{}', $.environment)",
                "Message": {
                  "Message": "Pipeline processed successfully",
                  "ScheduleTime.$": "$.scheduledTime"
                }
              },
              "End": true
            },
            "SNS Publish Failure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn.$": "States.Format('arn:aws:sns:ap-south-1:468094684048:github-analytics-{}', $.environment)",
                "Message": {
                  "Message": "Pipeline failed",
                  "ScheduleTime.$": "$.scheduledTime"
                }
              },
              "End": true
            }
          },
          "QueryLanguage": "JSONPath"
        }

  MyEventBrideScheduler1:
    Type: AWS::Scheduler::Schedule
    Properties:
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(30 13,16 ? * * *)
      ScheduleExpressionTimezone: UTC
      Target:
        Arn: !Ref MyStepFunction2
        Input: !Sub |
          {
          "environment": "${env}",
          "scheduledTime":"<aws.scheduler.scheduled-time>"
          }
        RoleArn: 
          Fn::ImportValue: !Sub "stepfnIAM-${env}"
      State: ENABLED
      Name: !Sub 'github-analytics-schedule-${env}'
  
  MySnSTopic:
    Type: "AWS::SNS::Topic"
    Properties:
      TopicName: !Sub github-analytics-${env}
      Subscription:
        - Endpoint: "hellothisissreejit@gmail.com"
          Protocol: "email"
