# Deploys stack networking.yml , storage.yml and then compute.yml
# Make sure to run setup.yml manually once per aws account, not per env.

name: infra_deployment

on:
    push:
        branches :
            - 'dev'
            - 'prod'

permissions:
    id-token: write
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkoutJob
              uses: actions/checkout@v2
            
           
            - name: authenticate aws creds
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: arn:aws:iam::468094684048:role/cicd-iam
                aws-region: "ap-south-1"
                role-session-name: SreejitsSession


            - name: Deploy network stack to AWS
              uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
              with:
                name: network-stack-${{ github.ref_name }}
                template: ./src/stacks/networking.yml
                parameter-overrides: 'env=${{ github.ref_name }}'
                capabilities: CAPABILITY_NAMED_IAM
                
                